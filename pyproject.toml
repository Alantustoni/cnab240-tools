[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnab240-tools"
version = "0.1.0"
description = "Juntar, validar e montar arquivos bancários CNAB240 (cobrança, retorno SISPAG, importação de boletos)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alan Tustoni" }]
requires-python = ">=3.13"
dependencies = []
keywords = ["cnab240", "febraban", "bradesco", "itau", "sispag", "boleto"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
